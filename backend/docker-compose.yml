# Unique compose project name — flow-connect, mgses, and si-ptik all have a
# backend/docker-compose.yml, so without this they'd share Compose's default
# "backend" project (directory-name-derived) and clobber each other's containers.
name: si-ptik-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: ptik_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ptik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ptik_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ptik_dev}
    ports: ["${POSTGRES_PORT:-5435}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ptik} -d ${POSTGRES_DB:-ptik_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migration runner — runs goose up once, then exits.
  migrate:
    build: { context: ., dockerfile: Dockerfile.migrate }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=postgres port=5432 user=${POSTGRES_USER:-ptik} password=${POSTGRES_PASSWORD:-ptik_secret} dbname=${POSTGRES_DB:-ptik_dev} sslmode=disable"
    restart: "no"

  # Seed runner — inserts default admin + sample dosen once, then exits.
  seed:
    build: { context: ., dockerfile: Dockerfile.dev }
    command: ["sh", "-c", "go run ./cmd/seed"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-ptik}:${POSTGRES_PASSWORD:-ptik_secret}@postgres:5432/${POSTGRES_DB:-ptik_dev}?sslmode=disable"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@ptik.id}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin12345}
    volumes:
      - ".:/app"
      - "go_cache:/go/pkg/mod"
      - "go_build:/root/.cache/go-build"
    restart: "no"

  # API — hot-reload via air.
  api:
    build: { context: ., dockerfile: Dockerfile.dev }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      seed: { condition: service_completed_successfully }
    environment:
      PORT: 8080
      DATABASE_URL: "postgres://${POSTGRES_USER:-ptik}:${POSTGRES_PASSWORD:-ptik_secret}@postgres:5432/${POSTGRES_DB:-ptik_dev}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me_at_least_32_chars_long}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    ports: ["${API_PORT:-8083}:8080"]
    volumes:
      - ".:/app"
      - "go_cache:/go/pkg/mod"
      - "go_build:/root/.cache/go-build"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  go_cache:
  go_build:
