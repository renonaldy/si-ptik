name: Deploy to VPS

# Setiap push ke main (atau dijalankan manual) → build frontend di runner,
# upload kode + dist/ ke VPS & rebuild image backend.
#
# CATATAN: `vite build` sengaja dijalankan DI RUNNER (RAM 7GB), bukan di VPS —
# build di VPS kecil pernah menghabiskan RAM sampai server freeze (2026-07-16).
# Dockerfile.web kini hanya menyalin dist/ yang sudah jadi.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Cegah dua deploy berjalan bersamaan.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend (di runner, bukan di VPS)
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload code + dist to server (rsync)
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=40" \
            ./ root@${{ secrets.DEPLOY_HOST }}:/opt/si-ptik/

      - name: Build & restart on server
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            root@${{ secrets.DEPLOY_HOST }} \
            "cd /opt/si-ptik && docker compose -f docker-compose.prod.yml up -d --build && docker image prune -f"
