name: Deploy to VPS

# Setiap push ke main (atau dijalankan manual) → upload kode ke VPS & rebuild.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Cegah dua deploy berjalan bersamaan.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload code to server (rsync)
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./ root@${{ secrets.DEPLOY_HOST }}:/opt/si-ptik/

      - name: Build & restart on server
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes root@${{ secrets.DEPLOY_HOST }} \
            "cd /opt/si-ptik && docker compose -f docker-compose.prod.yml up -d --build && docker image prune -f"
