name: ptik-web CI

on:
  push:
    paths: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Type-check
        run: bunx tsc --noEmit -p tsconfig.app.json
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
